logging:
  level:
    com.hyh.h2.mapper: debug

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:/test;DB_CLOSE_ON_EXIT=FALSE
    username: root
    password: 123456
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      schema-locations: classpath:database/schema.sql
      data-locations: classpath:database/data.sql

