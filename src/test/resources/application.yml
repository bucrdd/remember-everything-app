spring:
  application:
    name: remember-everything-app-test
  messages:
    fallback-to-system-locale: off
    encoding: UTF-8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/remember_everything?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username:
    password:
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

jwt:
  secret: some-secret
  expiration: 86400
  clock-skew: 30 # secondes
